<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exemplo NFS-e</title>
<style>
:root {
    --verde-escuro: #1F4D2C; --verde-escuro-hover: #2A6A3D;
    --verde-claro: #7FB069; --verde-claro-hover: #98C285;
    --verde-suave: #E8F2E1; --verde-borda: #C3DCB1;
    --fundo: #F7FAF5; --branco: #FFFFFF; --cinza-borda: #DEE5D8;
    --cinza-texto: #5A6B5C; --texto-principal: #1F2D22;
    --alerta-alta: #B23A48; --alerta-alta-bg: #FBE9EC;
    --alerta-media: #D68C28; --alerta-media-bg: #FFF4E2;
    --alerta-baixa: #4F7B9A; --alerta-baixa-bg: #E6EFF5;
    --sucesso: #2A6A3D; --sucesso-bg: #E8F2E1;
    --sombra: 0 2px 6px rgba(31, 77, 44, 0.08); --radius: 8px;
    --gradiente-ia: linear-gradient(135deg, #7FB069 0%, #1F4D2C 100%);
}
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--fundo); color: var(--texto-principal); font-size: 14px; line-height: 1.5; }
a { color: var(--verde-escuro); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
.topbar { background: var(--verde-escuro); color: white; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--sombra); }
.topbar .marca { font-weight: 700; font-size: 18px; letter-spacing: 0.5px; }
.topbar nav { display: flex; gap: 4px; }
.topbar nav a { color: white; padding: 8px 14px; border-radius: var(--radius); font-weight: 500; transition: background 0.15s; cursor: pointer; }
.topbar nav a:hover { background: rgba(255,255,255,0.15); text-decoration: none; }
.topbar nav a.ativo { background: var(--verde-claro); color: var(--verde-escuro); }
.topbar nav a.ia-btn { background: rgba(127,176,105,0.3); border: 1px solid var(--verde-claro); }
.topbar .usuario { display: flex; align-items: center; gap: 12px; font-size: 13px; }
.topbar .usuario .nome { opacity: 0.9; }
.topbar .usuario a { color: var(--verde-claro); }
.container { max-width: 1280px; margin: 24px auto; padding: 0 24px; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
.page-header h1 { margin: 0; color: var(--verde-escuro); font-size: 22px; }
.card { background: var(--branco); border: 1px solid var(--cinza-borda); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--sombra); }
.card h2 { margin: 0 0 16px; color: var(--verde-escuro); font-size: 16px; font-weight: 600; padding-bottom: 10px; border-bottom: 2px solid var(--verde-claro); }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
.kpi { background: var(--branco); border-left: 4px solid var(--verde-claro); border-radius: var(--radius); padding: 16px; box-shadow: var(--sombra); }
.kpi .label { color: var(--cinza-texto); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.kpi .valor { font-size: 28px; font-weight: 700; color: var(--verde-escuro); }
.kpi.destaque { border-left-color: var(--verde-escuro); }
.kpi.alerta { border-left-color: var(--alerta-media); }
.kpi.erro { border-left-color: var(--alerta-alta); }
table { width: 100%; border-collapse: collapse; background: var(--branco); }
table th { background: var(--verde-suave); color: var(--verde-escuro); text-align: left; padding: 10px 12px; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px; border-bottom: 2px solid var(--verde-claro); }
table td { padding: 10px 12px; border-bottom: 1px solid var(--cinza-borda); vertical-align: middle; }
table tr:hover td { background: var(--verde-suave); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.form-grupo { display: flex; flex-direction: column; }
.form-grupo label { font-size: 12px; font-weight: 600; color: var(--verde-escuro); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
.form-grupo input, .form-grupo select, .form-grupo textarea { border: 1px solid var(--cinza-borda); border-radius: var(--radius); padding: 9px 12px; background: var(--branco); font-size: 14px; font-family: inherit; }
.form-grupo input:focus, .form-grupo select:focus, .form-grupo textarea:focus { outline: none; border-color: var(--verde-claro); box-shadow: 0 0 0 3px var(--verde-suave); }
.form-grupo input:read-only, .form-grupo select:disabled { background: var(--fundo); color: var(--cinza-texto); cursor: not-allowed; }
.form-grupo textarea { resize: vertical; min-height: 80px; }
.form-grupo.full { grid-column: 1 / -1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s, transform 0.05s; text-decoration: none; font-family: inherit; }
.btn-pequeno { padding: 6px 12px; font-size: 12px; }
.btn:hover { transform: translateY(-1px); }
.btn-primario { background: var(--verde-escuro); color: white; }
.btn-primario:hover { background: var(--verde-escuro-hover); }
.btn-secundario { background: var(--verde-claro); color: var(--verde-escuro); }
.btn-outline { background: transparent; color: var(--verde-escuro); border: 1px solid var(--verde-escuro); }
.flash-msg { padding: 12px 16px; border-radius: var(--radius); margin-bottom: 16px; font-weight: 500; border-left: 4px solid; animation: slideIn 0.3s; }
.flash-msg.sucesso { background: var(--sucesso-bg); color: var(--sucesso); border-color: var(--sucesso); }
.flash-msg.erro { background: var(--alerta-alta-bg); color: var(--alerta-alta); border-color: var(--alerta-alta); }
.flash-msg.alerta { background: var(--alerta-media-bg); color: var(--alerta-media); border-color: var(--alerta-media); }
.alerta-particularidade { border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; border-left: 4px solid var(--alerta-media); background: var(--alerta-media-bg); color: #8C5A12; display: flex; align-items: flex-start; gap: 12px; }
.alerta-particularidade .icone { font-size: 20px; line-height: 1; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
.badge.pendente { background: #FFF4E2; color: #8C5A12; }
.badge.emitida { background: var(--sucesso-bg); color: var(--sucesso); }
.badge.erro { background: var(--alerta-alta-bg); color: var(--alerta-alta); }
.login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--verde-suave) 0%, var(--fundo) 100%); }
.login-box { background: var(--branco); padding: 40px; border-radius: 12px; box-shadow: 0 10px 40px rgba(31, 77, 44, 0.15); width: 380px; border-top: 4px solid var(--verde-claro); }
.login-box h1 { color: var(--verde-escuro); text-align: center; margin: 0 0 8px; font-size: 24px; }
.login-box .subtitulo { text-align: center; color: var(--cinza-texto); font-size: 13px; margin-bottom: 24px; }
.flex { display: flex; gap: 8px; align-items: center; }
.text-right { text-align: right; }
.text-muted { color: var(--cinza-texto); }
.mt-16 { margin-top: 16px; }
.mb-16 { margin-bottom: 16px; }
.hidden { display: none !important; }
.loading-screen { text-align: center; padding: 80px 20px; }
.spinner { border: 4px solid var(--verde-suave); border-top: 4px solid var(--verde-escuro); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.input-com-botao { display: flex; gap: 8px; align-items: stretch; width: 100%; }
.input-com-botao input { flex: 1; min-width: 0; }
.input-com-botao button { white-space: nowrap; flex-shrink: 0; }
@media print {
    .topbar, .btn, button, .input-com-botao, .page-header .flex { display: none !important; }
    body { background: white; }
    .container { max-width: 100%; padding: 0; margin: 0; }
    .card { box-shadow: none; border: 1px solid #ccc; page-break-inside: avoid; }
}
</style>
</head>
<body>

<div id="tela-login" class="login-page">
    <div class="login-box">
        <h1>Exemplo NFS-e</h1>
        <p class="subtitulo">Sistema de Emissão Integrado</p>
        <div id="login-erro"></div>
        <form id="form-login">
            <div class="form-grupo mb-16"><label>E-mail Corporativo</label><input type="email" id="login-email" required autofocus placeholder="usuario19@exemplo.com.br"></div>
            <div class="form-grupo mb-16"><label>Senha de Acesso</label><input type="password" id="login-senha" required></div>
            <button type="submit" class="btn btn-primario" style="width: 100%; justify-content: center;">Entrar no Sistema</button>
        </form>
    </div>
</div>

<div id="tela-criar-senha" class="login-page hidden">
    <div class="login-box">
        <h1>Criar Senha</h1>
        <p class="subtitulo">Primeiro acesso - defina sua senha e nome</p>
        <div id="criarsenha-erro"></div>
        <form id="form-criar-senha">
            <div class="form-grupo mb-16"><label>Seu Nome Completo *</label><input type="text" id="criarsenha-nome" required placeholder="Ex: Colaborador 3"></div>
            <div class="form-grupo mb-16"><label>Nova Senha *</label><input type="password" id="criarsenha-nova" required minlength="6"></div>
            <div class="form-grupo mb-16"><label>Confirmar Senha *</label><input type="password" id="criarsenha-confirma" required minlength="6"></div>
            <button type="submit" class="btn btn-primario" style="width: 100%; justify-content: center;">Salvar Dados e Entrar</button>
        </form>
    </div>
</div>

<div id="app" class="hidden">
    <header class="topbar">
        <div class="marca">Exemplo NFS-e</div>
        <nav id="nav-principal">
            <a data-pagina="dashboard">Painel</a>
            <a data-pagina="solicitacoes">Notas</a>
            <a data-pagina="solicitacao-nova">+ Nova Nota</a>
            <a data-pagina="solicitacao-ia" class="ia-btn">✨ Bot IA</a>
            <a data-pagina="prestadores">Prestadores</a>
        </nav>
        <div class="usuario">
            <span class="nome" id="usuario-nome"></span>
            <a id="btn-logout">Sair</a>
        </div>
    </header>
    <main class="container" id="conteudo"></main>
</div>

<script>
window.onerror = function(msg, url, line) {
  document.getElementById('conteudo').innerHTML = '<div class="flash-msg erro"><strong>ERRO JS (linha ' + line + '):</strong><br>' + msg + '</div>';
  return false;
};

function parseMoeda(val) {
    let v = String(val || '').trim();
    if(!v) return 0;
    if(v.includes(',')) { v = v.replace(/\./g, '').replace(',', '.'); }
    return parseFloat(v) || 0;
}

function carregarDadosIniciais() {
    google.script.run
        .withFailureHandler(function(erro) {
            document.getElementById('conteudo').innerHTML = `<div class="flash-msg erro"><strong>ERRO CRÍTICO:</strong><br>${erro}</div>`;
            const btn = document.querySelector('#form-login button'); if(btn) { btn.textContent = "Entrar no Sistema"; btn.disabled = false; }
        })
        .withSuccessHandler(function(resposta) {
            if (resposta.sucesso) {
                db.prestadores = resposta.prestadores || []; db.tomadores = resposta.tomadores || []; db.usuarios = resposta.usuarios || [];
                db.solicitacoes = resposta.solicitacoes || [];
                if (db.sessao) { navegar('dashboard'); }
            } else {
                document.getElementById('conteudo').innerHTML = `<div class="flash-msg erro"><strong>ERRO NA PLANILHA:</strong><br>${resposta.erro}</div>`;
                const btn = document.querySelector('#form-login button'); if(btn) { btn.textContent = "Entrar no Sistema"; btn.disabled = false; }
            }
        })
        .inicializarDadosDoSistema();
}

function fmtMoeda(v) { return (parseFloat(v) || 0).toFixed(2).replace('.', ','); }
function escapeHtml(s) { if (s == null) return ''; return s.toString().replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;'); }
function mesAtualInic() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-01'; }
function mesAtualFim() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); }

function exportarCSV(nomeArquivo, conteudo) {
    const blob = new Blob([conteudo], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.setAttribute("href", url); link.setAttribute("download", nomeArquivo); link.style.visibility = 'hidden';
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
}

function baixarExcelDashboard(inicio, fim) {
    const sols = db.solicitacoes.filter(s => {
        const d_criada = (s.criada_em || '').substring(0, 10);
        return d_criada >= inicio && d_criada <= fim;
    });
    let csv = "ID;Data;Prestador CNPJ;Tomador CNPJ;Socio;Valor Total;Status;Criado Por\n";
    sols.forEach(s => {
        csv += `${s.id};${s.criada_em};${s.prestador_cnpj};${s.cnpj_tomador};${s.socio_solicitante};${s.valor_total};${s.status};${s.criada_por}\n`;
    });
    exportarCSV(`Notas_${inicio}_ate_${fim}.csv`, csv);
}

const conteudo = document.getElementById('conteudo'); let flashMsg = null;
function navegar(pagina, params = {}) {
    document.querySelectorAll('#nav-principal a').forEach(a => { a.classList.toggle('ativo', a.dataset.pagina === pagina); });
    const flash = flashMsg; flashMsg = null; let html = ''; if (flash) html += `<div class="flash-msg ${flash.tipo}">${escapeHtml(flash.msg)}</div>`;

    if (pagina === 'dashboard') html += paginaDashboard(params);
    else if (pagina === 'prestadores') html += paginaPrestadores(params);
    else if (pagina === 'prestador-form') html += paginaPrestadorForm(params);
    else if (pagina === 'solicitacoes') html += paginaSolicitacoes(params);
    else if (pagina === 'solicitacao-nova') { html += paginaSolicitacaoNova(params); setTimeout(() => { if (params.id_edicao) preencherFormularioEdicao(params.id_edicao); }, 100); }
    else if (pagina === 'solicitacao-detalhe') html += paginaSolicitacaoDetalhe(params);
    else if (pagina === 'solicitacao-ia') html += paginaSolicitacaoIA(params);

    conteudo.innerHTML = html; window.scrollTo(0, 0);
}
function flash(msg, tipo = 'sucesso') { flashMsg = { msg, tipo }; }

    function limparCnpjFront(v) { return String(v || '').replace(/\D/g, ''); }
    function formatarCnpjExibicao(digitos) {
        if (!digitos || digitos.length !== 14) return digitos || '—';
        return digitos.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
    }
    async function resolverNomesCnpjPendentes(lista, tipo) {
        for (const item of lista) {
            if (!item.pendente || !item.cnpj || item.cnpj.length !== 14) continue;
            try {
                const res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${item.cnpj}`);
                if (!res.ok) continue;
                const data = await res.json();
                if (!data.razao_social) continue;
                document.querySelectorAll(`[data-cnpj-nome="${tipo}-${item.cnpj}"]`).forEach(el => { el.textContent = data.razao_social; });
                const alvo = (tipo === 'tomador') ? db.tomadores : db.prestadores;
                if (!alvo.find(x => limparCnpjFront(x.cnpj) === item.cnpj)) alvo.push({ cnpj: item.cnpj, razao_social: data.razao_social });
            } catch (e) { /* mantem fallback do CNPJ */ }
        }
    }

async function consultarCnpjApi() {
    const inputCnpj = document.getElementById('p-cnpj');
    let cnpjOriginal = inputCnpj.value; let cnpjNumeros = cnpjOriginal.replace(/\D/g, '');
    if(cnpjNumeros.length !== 14) { flash("Digite um CNPJ válido.", "erro"); return; }
    inputCnpj.value = "Consultando Receita...";
    try {
        let res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpjNumeros}`);
        if(!res.ok) throw new Error("CNPJ não encontrado na Receita.");
        let data = await res.json();
        document.getElementById('p-razao').value = data.razao_social; inputCnpj.value = cnpjOriginal;

        if (data.opcao_pelo_simples === true) {
            document.getElementById('p-regime').value = "Simples Nacional";
            flash("Identificamos na Receita: Simples Nacional!", "sucesso");
        }
        else if (data.opcao_pelo_simples === false) {
            document.getElementById('p-regime').value = "Lucro Presumido / Real";
        }

        let selectCnae = document.getElementById('p-cnae'); selectCnae.innerHTML = '<option value="">Não definir padrão</option>';
        if(data.cnae_fiscal) selectCnae.innerHTML += `<option value="${data.cnae_fiscal.toString().replace(/^(\d{2})(\d{2})(\d{1})(\d{2})$/, "$1.$2-$3/$4")}" selected>[PRINCIPAL] ${data.cnae_fiscal_descricao}</option>`;

async function consultarCnpjTomadorApi(isImporting = false) {
    const inputCnpj = document.getElementById('t-cnpj');
    let cnpjOriginal = inputCnpj.value;
    let cnpjNumeros = cnpjOriginal.replace(/\D/g, '');

    // CORREÇÃO: Permite CPF (11 dígitos) sem travar.
    if (cnpjNumeros.length === 11) {
        if (!isImporting) flash("CPF identificado. Preencha o nome/razão social manualmente, pois a busca automática só funciona com CNPJ.", "alerta");
        document.getElementById('t-regime').value = "Pessoa Física";
        atualizarParticularidadesTela();
        if (!isImporting) verificarNotaRecorrente();
        return;
    }

    if(cnpjNumeros.length !== 14) {
        if(!isImporting) flash("Digite um CPF (11) ou CNPJ (14) válido do Tomador.", "erro");
        return;
    }

    const btn = document.getElementById('btn-busca-tomador');
    btn.textContent = "Consultando...";
    btn.disabled = true;

    try {
        let res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpjNumeros}`);
        if(!res.ok) throw new Error("CNPJ do Tomador não encontrado na Receita.");
        let data = await res.json();

        document.getElementById('t-razao').value = data.razao_social;

        const campoRegime = document.getElementById('t-regime');
        if (data.opcao_pelo_simples === true) {
            campoRegime.value = "Simples Nacional";
            if(!isImporting) flash("Identificamos na Receita: Tomador optante pelo Simples Nacional.", "sucesso");
        } else if (data.opcao_pelo_simples === false) {
            campoRegime.value = "Lucro Presumido / Real";
            if(!isImporting) flash("Identificamos na Receita: Tomador não optante (Lucro Presumido / Real).", "sucesso");
        } else {
            campoRegime.value = "Não identificado";
        }

        atualizarParticularidadesTela();

        if (!isImporting) {
            verificarNotaRecorrente();
        }

    } catch(e) {
        if(!isImporting) flash(e.message, "erro");
    } finally {
        btn.textContent = "Buscar na Receita";
        btn.disabled = false;
    }
}

async function consultarCnpjPrestadorNovaNota() {
    const inputBusca = document.getElementById('i-prestador-busca');
    let cnpjNumeros = inputBusca.value.replace(/\D/g, '');

    if(cnpjNumeros.length !== 14) {
        flash("Digite um CNPJ válido com 14 números no campo do Prestador para consultar.", "erro");
        return;
    }

    const btn = document.getElementById('btn-busca-prestador-nota');
    btn.textContent = "Consultando...";
    btn.disabled = true;

    try {
        let res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpjNumeros}`);
        if(!res.ok) throw new Error("CNPJ do Prestador não encontrado na Receita.");
        let data = await res.json();

        const campoRegime = document.getElementById('i-regime-prestador');
        if (data.opcao_pelo_simples === true) {
            definirRegimePrestador("Simples Nacional");
            flash("Identificamos na Receita: Prestador optante pelo Simples Nacional.", "sucesso");
        } else if (data.opcao_pelo_simples === false) {
            definirRegimePrestador("Lucro Presumido / Real");
            flash("Identificamos na Receita: Prestador não optante (Lucro Presumido / Real).", "sucesso");

        }

        inputBusca.value = `${data.razao_social} - ${data.cnpj}`;

        btn.textContent = "Consultar Receita";
        btn.disabled = false;
    }
}

function atualizarListaItensPrestador() {
    const cnaeSelecionado = document.getElementById('p-cnae').value; const selectItem = document.getElementById('p-item');
    if(!cnaeSelecionado) { selectItem.innerHTML = '<option value="">Selecione o CNAE primeiro</option>'; return; }

function paginaSolicitacaoDetalhe(params) {
    const sol = db.solicitacoes.find(s => String(s.id) === String(params.id));
    if (!sol) return `<div class="page-header"><h1>Nota não encontrada</h1></div>`;

    let cnaeApenas = sol.cnae || '—'; let itemApenas = '—';
    const matchCnae = cnaeApenas.match(/(.*?)\s*\(Item LC:\s*(.*?)\)/);
    if(matchCnae) { cnaeApenas = matchCnae[1].trim(); itemApenas = matchCnae[2].trim(); }

    const isEmitida = sol.status === 'EMITIDA' || sol.status === 'EMITIDO COM SUCESSO';

    // CORREÇÃO MÁXIMA DE EXIBIÇÃO: Impede a planilha de mostrar 0,00 se estiver corrompida.
    // O sistema agora SEMPRE calcula a matemática correta visualmente pra você!
    const parseNumLocal = (v) => {
        if(typeof v === 'number') return v;
        let str = String(v||'').replace(/[R$\s]/g, '');
        if(str.includes(',')) str = str.replace(/\./g, '').replace(',', '.');
        return parseFloat(str) || 0;
    };

    const valorBruto = parseNumLocal(sol.valor_total);
    const aliquotaIss = parseNumLocal(sol.aliquota);
    const issCalculado = sol.iss_retido === 'Sim' ? valorBruto * (aliquotaIss / 100) : 0;

    const retencaoT = parseNumLocal(sol.inss) + parseNumLocal(sol.irrf) + parseNumLocal(sol.csll) + parseNumLocal(sol.cofins) + parseNumLocal(sol.pis) + parseNumLocal(sol.outras_retencoes);
    const liquidoCalculado = valorBruto - retencaoT - issCalculado;

    const exibeLiquido = sol.valor_liquido > 0 && Math.abs(sol.valor_liquido - liquidoCalculado) < 1 ? sol.valor_liquido : liquidoCalculado;

    return `
        <div class="page-header">
            <h1>Detalhes da Solicitação #${sol.id} <span class="badge ${isEmitida ? 'emitida' : 'pendente'}">${sol.status}</span></h1>
            <div class="flex">
                ${isEmitida && sol.link_pdf && sol.link_pdf.trim() !== '' ? `<a href="${escapeHtml(sol.link_pdf)}" target="_blank" class="btn btn-secundario" style="margin-right: 8px;">📄 Abrir PDF da Nota</a>` : ''}
                ${!isEmitida && sol.status !== 'EMITIR' ? `<button class="btn btn-secundario" onclick="navegar('solicitacao-nova',{id_edicao:${sol.id}})">✏️ Editar Solicitação</button>` : ''}
                <button class="btn btn-outline" onclick="navegar('solicitacoes')">← Voltar</button>
            </div>
        </div>
        <div class="card">
            <h2>Informações do Pedido</h2>
            <div class="form-grid">
                <div><label>PRESTADOR CNPJ:</label> <br><strong>${escapeHtml(sol.prestador_cnpj)}</strong></div>
                <div><label>TOMADOR CNPJ:</label> <br><strong>${escapeHtml(sol.cnpj_tomador)}</strong></div>
                <div><label>SÓCIO SOLICITANTE:</label> <br><strong>${escapeHtml(sol.socio_solicitante || '—')}</strong></div>
                <div><label>CRIADA POR:</label> <br><strong>${escapeHtml(sol.criada_por || '—')}</strong></div>
            </div>
            <br>
            <div class="form-grid">
                <div><label>VALOR TOTAL:</label> <br><strong>R$ ${fmtMoeda(sol.valor_total)}</strong></div>
                <div><label>VALOR LÍQUIDO:</label> <br><strong style="color:var(--verde-escuro);">R$ ${fmtMoeda(exibeLiquido)}</strong></div>
                <div><label>CNAE:</label> <br><strong>${escapeHtml(cnaeApenas)}</strong></div>
                <div><label>ITEM DA LISTA:</label> <br><strong>${escapeHtml(itemApenas)}</strong></div>
                <div><label>ISS RETIDO?</label> <br><strong>${escapeHtml(sol.iss_retido || 'Não')}</strong></div>
            </div>
            <br>
            <div class="form-grid">
                <div><label>CÓD. TRIBUTÁRIO NACIONAL:</label> <br><strong>${escapeHtml(sol.codigo_tributario_nacional || '—')}</strong></div>
                <div><label>CTISS (SALVADOR):</label> <br><strong>${escapeHtml(sol.ctiss || '—')}</strong></div>
                <div><label>NBS (RFB):</label> <br><strong>${escapeHtml(sol.nbs || '—')}</strong></div>
                <div><label>CCLASSTRIB:</label> <br><strong>${escapeHtml(sol.cclasstrib || '—')}</strong></div>
                <div><label>CINDOP:</label> <br><strong>${escapeHtml(sol.cindop || '—')}</strong></div>
            </div>
            <br>
            <div>
                <label>DISCRIMINAÇÃO DOS SERVIÇOS:</label>
                <div style="background:var(--verde-suave); padding:12px; border-radius:6px; margin-top:4px;">${escapeHtml(sol.discriminacao).replace(/\n/g, '<br>')}</div>
            </div>
            <br>
            <h3>Retenções e Impostos Calculados</h3>
            <table>
                <tr>
                    <td>INSS: <strong>R$ ${fmtMoeda(sol.inss)}</strong></td>
                    <td>IRRF: <strong>R$ ${fmtMoeda(sol.irrf)}</strong></td>
                    <td>CSLL: <strong>R$ ${fmtMoeda(sol.csll)}</strong></td>
                </tr>
                <tr>
                    <td>COFINS: <strong>R$ ${fmtMoeda(sol.cofins)}</strong></td>
                    <td>PIS: <strong>R$ ${fmtMoeda(sol.pis)}</strong></td>
                    <td>OUTRAS: <strong>R$ ${fmtMoeda(sol.outras_retencoes)}</strong></td>
                </tr>
                <tr>
                    <td colspan="3" style="background: var(--fundo);">ISS RETIDO DESCONTADO: <strong style="color: var(--alerta-alta);">R$ ${fmtMoeda(issCalculado)}</strong> (${sol.iss_retido === 'Sim' ? 'Abatido do Líquido' : 'Não Retido'})</td>
                </tr>
            </table>

            ${!isEmitida && sol.status !== 'EMITIR' ? `
            <div class="text-right mt-16" style="border-top: 1px solid var(--cinza-borda); padding-top: 16px;">
                <button class="btn btn-primario" id="btn-mudar-status" onclick="mudarStatusParaEmitir('${sol.id}')">✓ Validado: Enviar para Emissão</button>
            </div>
            ` : `<div class="text-right mt-16" style="border-top: 1px solid var(--cinza-borda); padding-top: 16px;"><span class="text-muted">A nota já foi enviada para o robô emissor.</span></div>`}
        </div>
    `;
}

function mudarStatusParaEmitir(idNota) {
    if(!confirm("Atenção: Mudar o status para EMITIR colocará a nota diretamente na fila do robô. Continuar?")) return;
    const btn = document.getElementById('btn-mudar-status'); btn.textContent = "Acionando Automação..."; btn.disabled = true;
    google.script.run.withFailureHandler(function(erro) { flash('Erro ao comunicar: ' + erro, 'erro'); btn.textContent = "✓ Validado: Enviar para Emissão"; btn.disabled = false; })
        .withSuccessHandler(function(res) {
            if(res.sucesso) {
                const idxNota = db.solicitacoes.findIndex(s => String(s.id) === String(idNota));
                if (idxNota > -1) db.solicitacoes[idxNota].status = 'EMITIR';
                flash("Nota enviada para emissão!");
                navegar('solicitacao-detalhe', { id: idNota });
            } else {
                flash("Erro: " + res.erro, "erro");
                btn.disabled = false;
            }
        })
        .alterarStatusNota(idNota, "EMITIR");
}

function lerArquivoBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
    });
}

function enviarParaBotIA() {
    const btn = document.getElementById('btn-ia-enviar');
    const aviso = document.getElementById('ia-aviso');
    const texto = document.getElementById('ia-texto').value.trim();
    const inputArquivo = document.getElementById('ia-arquivo');

    if (!texto) { flash("Digite um texto para o robô analisar.", "alerta"); return; }

    btn.disabled = true; btn.classList.add('hidden');
    aviso.classList.remove('hidden');

    let base64 = null;
    let mimeType = null;

    const executarChamada = (b64, mime) => {
        google.script.run
            .withFailureHandler(function(erro) {
                aviso.classList.add('hidden'); btn.classList.remove('hidden'); btn.disabled = false;
                flash('Falha de conexão com o Robô: ' + erro, 'erro');
            })
            .withSuccessHandler(function(res) {
                if (res.sucesso) {
                    google.script.run
                        .withSuccessHandler(function(resposta) {
                            if (resposta.sucesso) {
                                db.solicitacoes = resposta.solicitacoes || [];
                                flash("✨ Rascunho criado pela IA! Revise os dados abaixo e clique em Salvar.", "sucesso");
                                navegar('solicitacao-nova', { id_edicao: res.novoId });
                            }
                        })
                        .inicializarDadosDoSistema();
                } else {
                    aviso.classList.add('hidden'); btn.classList.remove('hidden'); btn.disabled = false;
                    flash("Erro no processamento da IA: " + res.erro, "erro");
                }
            })
            .processarPedidoComIA(texto, b64, mime, db.sessao.nome, db.sessao.email);
    };

    if (inputArquivo.files.length > 0) {
        const file = inputArquivo.files[0];
        mimeType = file.type;
        lerArquivoBase64(file).then(b64 => executarChamada(b64, mimeType)).catch(e => {
            aviso.classList.add('hidden'); btn.classList.remove('hidden'); btn.disabled = false;
            flash("Erro ao ler o arquivo.", "erro");
        });
    } else {
        executarChamada(null, null);
    }
}

// ==========================================
// FUNÇÕES DE IMPORTAÇÃO DE PDF (NOTA SALVADOR)
// ==========================================
function importarPDFAnterior() {
    const fileInput = document.getElementById('pdf-import-nota');
    const status = document.getElementById('status-import-pdf');
    const btn = document.getElementById('btn-import-pdf');
    const file = fileInput.files[0];

    if (!file) { flash("Por favor, selecione um arquivo PDF.", "alerta"); return; }

    btn.disabled = true;
    status.innerHTML = '<span style="color: var(--alerta-media);">⏳ Lendo PDF. Isso pode levar alguns segundos...</span>';

    const reader = new FileReader();
    reader.onload = function(e) {
        const base64 = e.target.result.split(',')[1];
        google.script.run
            .withSuccessHandler((dados) => {
                btn.disabled = false;
                if (dados.erro) {
                    status.innerHTML = `<span style="color: var(--alerta-alta);">❌ Erro na extração: ${dados.erro}</span>`;
                    return;
                }
                status.innerHTML = '<span style="color: var(--sucesso);">✅ Dados extraídos com sucesso!</span>';
                preencherCamposImportados(dados);
            })
            .withFailureHandler((erro) => {
                btn.disabled = false;
                status.innerHTML = `<span style="color: var(--alerta-alta);">❌ Falha na comunicação: ${erro}</span>`;
            })
            .processarPDFNotaSalvador(base64, file.name);
    };
    reader.readAsDataURL(file);
}

function formatarCnaeVent(cnaeOriginal) {
    let v = String(cnaeOriginal).replace(/\D/g, '');
    if (v.length === 7) return v.substring(0,2) + '.' + v.substring(2,4) + '-' + v.substring(4,5) + '/' + v.substring(5,7);
    return cnaeOriginal;
}

// INJEÇÃO DOS DADOS DO PDF NA TELA

async function preencherCamposImportados(d) {

    if (d.prestadorCNPJ) {
        const pMatch = db.prestadores.find(p => p.cnpj.replace(/\D/g, '') === d.prestadorCNPJ.replace(/\D/g, ''));
        if (pMatch) {
            document.getElementById('i-prestador-busca').value = `${pMatch.razao_social} - ${pMatch.cnpj}`;
        } else {
            document.getElementById('i-prestador-busca').value = d.prestadorCNPJ;
        }
        await aoMudarPrestador();
    }

    if (d.tomadorCNPJ) {
        document.getElementById('t-cnpj').value = d.tomadorCNPJ;
        // Aciona o clique no botão para puxar a Razão Social da API
        document.getElementById('btn-busca-tomador').click();
    }

    if (d.regimePrestador && d.regimePrestador !== "Não informado") {
        definirRegimePrestador(d.regimePrestador);
    }

    if (d.tomadorRazao) { document.getElementById('t-razao').value = d.tomadorRazao; }
    if (d.valorTotal) { document.getElementById('i-vlr-total').value = d.valorTotal; }
    if (d.discriminacao) { document.getElementById('i-discr').value = d.discriminacao; }
    if (d.aliquota) { document.getElementById('i-aliquota').value = d.aliquota; }
    if (d.issRetido) { document.getElementById('i-iss').value = d.issRetido; } if (d.pisCofinsRetido) { document.getElementById('i-pis-cofins-retido').value = d.pisCofinsRetido; } aplicarRegraPisCofinsRetido();

    if (d.inss) document.getElementById('i-inss').value = d.inss;
    if (d.irrf) document.getElementById('i-irrf').value = d.irrf;
    if (d.csll) document.getElementById('i-csll').value = d.csll;
    if (d.cofins) document.getElementById('i-cofins').value = d.cofins;
    if (d.pis) document.getElementById('i-pis').value = d.pis;

    if (d.cnae) {
        const cnaeLimpo = d.cnae.replace(/\D/g, '');
        const listCnae = document.getElementById('lista-cnaes-nota');
        const optsCnae = listCnae.querySelectorAll('option');
        let achouCnae = false;

        for(let opt of optsCnae) {
            if(opt.value.replace(/\D/g, '').startsWith(cnaeLimpo)) {
                document.getElementById('i-cnae').value = opt.value;
                achouCnae = true; break;
            }
        }
        if(!achouCnae) document.getElementById('i-cnae').value = formatarCnaeVent(d.cnae);
        aoMudarCnaeNota();
    }

    // NORMALIZADOR ABSOLUTO E FORÇADOR DE SELEÇÃO
    if (d.itemLC) {
        let itemClean = d.itemLC.replace(/[^\d\.]/g, '');

        // Bloqueia leituras erradas convertendo para o formato exato
        if (itemClean === "00.40" || itemClean === "0.40" || itemClean === "404" || itemClean === "0404" || itemClean === "4.04") {
            itemClean = "04.04";
        } else {
            let p = itemClean.split('.');
            if (p.length === 2) itemClean = p[0].padStart(2, '0') + '.' + p[1].padStart(2, '0');
            else if (itemClean.length === 3) itemClean = '0' + itemClean.charAt(0) + '.' + itemClean.substring(1);
            else if (itemClean.length >= 4) itemClean = itemClean.substring(0,2) + '.' + itemClean.substring(2,4);
        }

        const inputItem = document.getElementById('i-item');
        const dataList = document.getElementById('lista-itens-nota');
        let found = false;

        // Passo 1: Procurar na lista atual
        const options = dataList.querySelectorAll('option');
        for(let opt of options) {
            if(opt.value.startsWith(itemClean)) {
                inputItem.value = opt.value; // Puxa frase inteira (ex: 04.04 - Médicos...)
                found = true; break;
            }
        }

        // Passo 2: Se não achou na lista gerada, procura no mapa global pra preencher perfeito
        if (!found) {
            for (let cnaeKey in MAPA_CNAES) {
                let itemsDoCnae = MAPA_CNAES[cnaeKey];
                for (let i = 0; i < itemsDoCnae.length; i++) {
                    if (itemsDoCnae[i].item === itemClean) {
                        let textoCompleto = itemsDoCnae[i].item + " - " + itemsDoCnae[i].desc;
                        inputItem.value = textoCompleto;
                        dataList.innerHTML += `<option value="${textoCompleto}">`;
                        found = true; break;
                    }
                }
                if (found) break;
            }
        }

        // Se tudo falhar, injeta o número limpo
        if(!found && itemClean !== "" && itemClean !== "00.00") inputItem.value = itemClean;

        verificarRegrasEspeciais();
    }

    calcularLiquido();
    flash("Formulário preenchido com os dados da Nota Salvador!", "sucesso");
}

function preencherFormularioEdicao(id) {
    const sol = db.solicitacoes.find(s => String(s.id) === String(id));
    if (!sol) return;

    document.getElementById('titulo-form-nota').textContent = `Revisar Rascunho / Solicitação #${id}`;
    document.getElementById('i-prestador-busca').value = `${db.prestadores.find(p=>p.cnpj===sol.prestador_cnpj)?.razao_social || ''} - ${sol.prestador_cnpj}`;
    document.getElementById('sel-prestador').value = db.prestadores.find(p=>p.cnpj===sol.prestador_cnpj)?.id || '';
    document.getElementById('i-pis-cofins-retido').value = sol.pis_cofins_retido || 'Não';
    definirRegimePrestador(db.prestadores.find(p=>p.cnpj===sol.prestador_cnpj)?.regime_tributario || '');

    document.getElementById('i-socio').value = sol.socio_solicitante || '';
    document.getElementById('t-cnpj').value = sol.cnpj_tomador || '';

    const tMatch = db.tomadores.find(t=>t.cnpj===sol.cnpj_tomador);
    document.getElementById('t-razao').value = tMatch ? tMatch.razao_social : sol.cnpj_tomador;
    document.getElementById('t-regime').value = sol.regime_tomador || (tMatch ? tMatch.regime_tributario : '');

    document.getElementById('i-vlr-total').value = (sol.valor_total || 0).toFixed(2).replace('.',',');
    document.getElementById('i-aliquota').value = sol.aliquota || '';

    if (document.getElementById('i-cod-trib-nac')) document.getElementById('i-cod-trib-nac').value = sol.codigo_tributario_nacional || '';
    if (document.getElementById('i-ctiss')) document.getElementById('i-ctiss').value = sol.ctiss || '';
    if (document.getElementById('i-nbs')) document.getElementById('i-nbs').value = sol.nbs || '';
    if (document.getElementById('i-cclasstrib')) document.getElementById('i-cclasstrib').value = sol.cclasstrib || '';
    if (document.getElementById('i-cindop')) document.getElementById('i-cindop').value = sol.cindop || '';

    let cnaeApenas = sol.cnae || ''; let itemApenas = '';
    const matchCnae = cnaeApenas.match(/(.*?)\s*\(Item LC:\s*(.*?)\)/);
    if(matchCnae) { document.getElementById('i-cnae').value = matchCnae[1].trim(); document.getElementById('i-item').value = matchCnae[2].trim(); }
    else { document.getElementById('i-cnae').value = cnaeApenas; }

    document.getElementById('i-iss').value = sol.iss_retido || 'Não';
    document.getElementById('i-discr').value = sol.discriminacao || '';

    document.getElementById('i-inss').value = (sol.inss||0).toFixed(2).replace('.',',');
    document.getElementById('i-irrf').value = (sol.irrf||0).toFixed(2).replace('.',',');
    document.getElementById('i-csll').value = (sol.csll||0).toFixed(2).replace('.',',');
    document.getElementById('i-cofins').value = (sol.cofins||0).toFixed(2).replace('.',',');
    document.getElementById('i-pis').value = (sol.pis||0).toFixed(2).replace('.',',');
    document.getElementById('i-outras').value = (sol.outras_retencoes||0).toFixed(2).replace('.',',');

    atualizarParticularidadesTela();
    verificarRegrasEspeciais();
    calcularLiquido();
}

function verificarRegrasEspeciais() {
    const itemLCLimpo = document.getElementById('i-item').value.trim().split(' - ')[0];
    const painelMista = document.getElementById('painel-mista');
    const inputVlrTotal = document.getElementById('i-vlr-total');
    const selectIss = document.getElementById('i-iss');

    const itensTributacaoMista = ['07.02', '7.02', '07.05', '7.05', '13.05', '14.01', '14.03', '17.11'];
    if (itensTributacaoMista.includes(itemLCLimpo)) {
        painelMista.classList.remove('hidden'); inputVlrTotal.readOnly = true;
    } else { painelMista.classList.add('hidden'); inputVlrTotal.readOnly = false; }

    const itensRetencaoISS = ['03.05', '3.05', '07.02', '7.02', '07.04', '7.04', '07.05', '7.05', '07.09', '7.09', '07.10', '7.10', '07.12', '7.12', '07.14', '7.14', '07.15', '7.15', '07.17', '7.17', '11.02', '17.05', '17.10', '20.01', '20.02', '20.03'];
    if (itensRetencaoISS.includes(itemLCLimpo)) {
        selectIss.value = 'Sim'; selectIss.disabled = true;
        flash("Atenção: Este serviço possui retenção OBRIGATÓRIA de ISS pelo tomador. Botão de ISS travado.", "alerta");
    } else { selectIss.disabled = false; }
    calcularLiquido();
}

function somaMista() {
    const f = document.getElementById('form-solicitacao');
    const num = (n) => parseMoeda(f.elements[n].value);
    document.getElementById('i-vlr-total').value = (num('valor_servico') + num('valor_pecas')).toFixed(2).replace('.', ',');
    calcularLiquido();
}

function autoCalcularImpostos() {
    const f = document.getElementById('form-solicitacao');
    const num = (n) => parseMoeda(f.elements[n].value);
    const isMista = !document.getElementById('painel-mista').classList.contains('hidden');
    let baseCalculoFederais = isMista ? num('valor_servico') : num('valor_total');

    if(baseCalculoFederais <= 0) { flash("Informe um Valor Total (ou de Serviço) maior que zero antes de calcular.", "alerta"); return; }
    const pid = parseInt(f.elements['prestador_id'].value, 10); const p = db.prestadores.find(x => x.id === pid);

    if (p && p.regime_tributario !== "Simples Nacional") {
        let aliquotaSal = 5;
        const itemLCLimpo = document.getElementById('i-item').value.trim().split(' - ')[0];
        if (['04.01','04.02','04.03','04.06','04.08','04.12','05.01','05.02','07.02','07.04','07.05'].includes(itemLCLimpo)) { aliquotaSal = 3; }
        if (['10.01','10.02','10.03','10.09','10.10'].includes(itemLCLimpo)) { aliquotaSal = 4; }

        document.getElementById('i-aliquota').value = aliquotaSal; document.getElementById('i-aliquota').readOnly = true;
        flash(`Regime da Empresa exige ISS: Alíquota de Salvador aplicada (${aliquotaSal}%).`, "sucesso");
    }

    let isAliquotaDiferenciada = false;
    const cnaeNum = (f.elements['cnae'].value || '').split(' - ')[0].replace(/\D/g, '');
    const prefixosExcecao = ['8610101', '8610102', '8630502', '8640202', '4120400', '4321500', '4330404'];
    if (prefixosExcecao.some(prefix => cnaeNum.startsWith(prefix))) isAliquotaDiferenciada = true;
    if (p && p.observacao && p.observacao.toLowerCase().includes('alíquota diferenciada')) isAliquotaDiferenciada = true;

    if (isAliquotaDiferenciada) {
        f.elements['irrf'].value = (baseCalculoFederais * 0.012).toFixed(2).replace('.', ',');
        document.getElementById('txt-regra-ir').innerHTML = '<strong style="color:var(--alerta-media);">Alíquota diferenciada de IR (1,2%) aplicada. Código Receita: 6147</strong>';
    } else {
        f.elements['irrf'].value = (baseCalculoFederais * 0.015).toFixed(2).replace('.', ',');
        document.getElementById('txt-regra-ir').innerHTML = 'Calculado automaticamente (IRRF 1.5%, CSLL 1%, COFINS 3%, PIS 0.65%).';
    }

    f.elements['csll'].value = (baseCalculoFederais * 0.01).toFixed(2).replace('.', ',');
    f.elements['cofins'].value = (baseCalculoFederais * 0.03).toFixed(2).replace('.', ',');
    f.elements['pis'].value = (baseCalculoFederais * 0.0065).toFixed(2).replace('.', ',');
    calcularLiquido();
}

function calcularLiquido() {
    const f = document.getElementById('form-solicitacao'); if(!f) return;
    const num = (n) => parseMoeda(f.elements[n].value);
    const bruto = num('valor_total');

    const aliquotaIss = num('aliquota');
    const issRetido = document.getElementById('i-iss').value === 'Sim';
    let abatimentoIss = 0;
    if (issRetido && aliquotaIss > 0) {
        abatimentoIss = bruto * (aliquotaIss / 100);
    }

    const retencoes = num('inss') + num('irrf') + num('csll') + num('cofins') + num('pis') + num('outras_retencoes') + abatimentoIss;
    document.getElementById('i-liquido').value = (bruto - retencoes).toFixed(2).replace('.', ',');
}

function atualizarParticularidadesTela() {
    const painelPart = document.getElementById('painel-particularidades');
    const listaPart = document.getElementById('lista-particularidades');
    if (!painelPart) return;

    let obsHtml = "";

    const inputPrestador = document.getElementById('i-prestador-busca').value;
    const p = db.prestadores.find(x => `${x.razao_social} - ${x.cnpj}` === inputPrestador);
    if (p) {
        if (p.observacao && p.observacao.trim() !== '') {
            obsHtml += `<div class="alerta-particularidade"><div class="icone">📌</div><div class="corpo"><strong>PRESTADOR — OBSERVAÇÕES:</strong><br>${escapeHtml(p.observacao).replace(/\n/g, '<br>')}</div></div>`;
        }
              if (p.dados_bancarios && p.dados_bancarios.trim() !== '') {
                        obsHtml += `<div class="alerta-particularidade" style="background:var(--verde-suave); border-color:var(--verde-claro); color:var(--verde-escuro);">
                                  <div class="icone">🏦</div>
                                            <div class="corpo"><strong>DADOS BANCÁRIOS DO PRESTADOR:</strong><br>${escapeHtml(p.dados_bancarios).replace(/\n/g, '<br>')}</div></div>`;

        }
    }

    const tomadorCNPJ = document.getElementById('t-cnpj').value.trim();
    const t = db.tomadores.find(x => x.cnpj === tomadorCNPJ);
    if (t) {
        if (t.observacao && t.observacao.trim() !== '') {
            obsHtml += `<div class="alerta-particularidade" style="border-left-color: var(--alerta-baixa); background: var(--alerta-baixa-bg); color: #1F4D2C;"><div class="icone">📋</div><div class="corpo"><strong>TOMADOR — REGRAS E DIRETRIZES:</strong><br>${escapeHtml(t.observacao).replace(/\n/g, '<br>')}</div></div>`;
        }
        if (t.banco || t.agencia || t.conta || t.chave_pix) {
            obsHtml += `<div class="alerta-particularidade" style="background: #F0F4F8; border-color: #B0C4DE; color: #333;">
                <div class="icone">💳</div>
                <div class="corpo"><strong>DADOS BANCÁRIOS / COBRANÇA DO TOMADOR:</strong><br>
                Banco: ${escapeHtml(t.banco || '—')} | Agência: ${escapeHtml(t.agencia || '—')} | Conta: ${escapeHtml(t.conta || '—')}<br>
                Chave PIX: <strong>${escapeHtml(t.chave_pix || '—')}</strong></div></div>`;
        }
    }

    if (obsHtml !== '') { painelPart.classList.remove('hidden'); listaPart.innerHTML = obsHtml; }
    else { painelPart.classList.add('hidden'); listaPart.innerHTML = ''; }
}

function aplicarRegraPisCofinsRetido() {
  const selRegime = document.getElementById('i-regime-prestador');
  const sel = document.getElementById('i-pis-cofins-retido');
  if (!selRegime || !sel) return;
  const regime = selRegime.value;
  if (regime === 'Simples Nacional') { sel.value = 'Não'; sel.disabled = true; }
  else { sel.disabled = false; }
}
function definirRegimePrestador(valor) {
  const sel = document.getElementById('i-regime-prestador');
  if (!sel) return;
  const regimesValidos = ['Simples Nacional', 'Lucro Presumido / Real'];
  sel.value = regimesValidos.includes(valor) ? valor : '';
  aplicarRegraPisCofinsRetido();
}
async function aoMudarPrestador() {
    const inputPrestador = document.getElementById('i-prestador-busca').value;
    const match = db.prestadores.find(p => `${p.razao_social} - ${p.cnpj}` === inputPrestador);
    const pid = match ? match.id : null;
    document.getElementById('sel-prestador').value = pid || "";

    const dataListCnae = document.getElementById('lista-cnaes-nota'); const dataListItens = document.getElementById('lista-itens-nota');
    const inputCnae = document.getElementById('i-cnae'); const inputItem = document.getElementById('i-item');

    if (!pid) {
        dataListCnae.innerHTML = ''; dataListItens.innerHTML = '';
        definirRegimePrestador(""); atualizarParticularidadesTela(); return;
    }
    const p = match;
    definirRegimePrestador(p.regime_tributario || "");

    let cnaePadraoSo = ""; let itemPadraoSo = "";
    if (p.cnae_padrao) {
        const matchCnae = p.cnae_padrao.match(/(.*?)\s*\(Item LC:\s*(.*?)\)/);
        if(matchCnae) { cnaePadraoSo = matchCnae[1].trim(); itemPadraoSo = matchCnae[2].trim(); } else { cnaePadraoSo = p.cnae_padrao; }
    }

    inputCnae.value = cnaePadraoSo; inputItem.value = itemPadraoSo;
    if (p.descricao_padrao) document.getElementById('i-discr').value = p.descricao_padrao;
    if (p.aliquota_padrao) document.getElementById('i-aliquota').value = p.aliquota_padrao;

    atualizarParticularidadesTela();
    verificarRegrasEspeciais();

    try {
        let cnpjNumeros = p.cnpj.replace(/\D/g, ''); let res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpjNumeros}`);
        if(res.ok) {
            let data = await res.json(); let htmlCnae = "";
            if(data.cnae_fiscal) { const codFiscal = data.cnae_fiscal.toString().padStart(7, '0').replace(/^(\d{2})(\d{2})(\d{1})(\d{2})$/, "$1.$2-$3/$4"); htmlCnae += `<option value="${codFiscal} - ${data.cnae_fiscal_descricao}">`; }
            if(data.cnaes_secundarios) { data.cnaes_secundarios.forEach(c => { if(c.codigo !== 0) { const codSec = c.codigo.toString().padStart(7, '0').replace(/^(\d{2})(\d{2})(\d{1})(\d{2})$/, "$1.$2-$3/$4"); htmlCnae += `<option value="${codSec} - ${c.descricao}">`; } }); }
            dataListCnae.innerHTML = htmlCnae; aoMudarCnaeNota();
        }
    } catch(e) { flash("Não foi possível carregar a lista de CNAEs deste prestador. Verifique sua conexão ou digite o CNAE manualmente.", "erro"); }
}

function aoMudarCnaeNota() {
    const inputCnae = document.getElementById('i-cnae').value; const dataListItens = document.getElementById('lista-itens-nota');
    const cnaeLimpo = inputCnae.split(' - ')[0].replace(/\D/g, '').padStart(7, '0'); const itensVinculados = MAPA_CNAES[cnaeLimpo];
    if(itensVinculados && itensVinculados.length > 0) { dataListItens.innerHTML = itensVinculados.map(i => `<option value="${i.item} - ${i.desc}">${i.item} - ${i.desc}</option>`).join(''); }
    else { dataListItens.innerHTML = ''; if (cnaeLimpo && cnaeLimpo !== '0000000') flash("Nenhum item da lista de serviços (LC 116) cadastrado para este CNAE. Selecione o item manualmente.", "alerta"); }
    verificarRegrasEspeciais();
}

async function aoMudarTomador() {
    const inputTomador = document.getElementById('i-tomador-busca').value;
    const match = db.tomadores.find(t => `${t.razao_social} - ${t.cnpj}` === inputTomador);
    if (match) {
        document.getElementById('t-cnpj').value = match.cnpj;
        document.getElementById('t-razao').value = match.razao_social;
        document.getElementById('t-regime').value = match.regime_tributario || '';
        atualizarParticularidadesTela();
        verificarNotaRecorrente();
    }
}

function verificarNotaRecorrente() {
    const prestadorCNPJ = db.prestadores.find(p => p.id === parseInt(document.getElementById('sel-prestador').value, 10))?.cnpj;
    const tomadorCNPJ = document.getElementById('t-cnpj').value.trim();
    if (!prestadorCNPJ || !tomadorCNPJ) return;
    const ultimaNota = [...db.solicitacoes].reverse().find(s => s.prestador_cnpj === prestadorCNPJ && s.cnpj_tomador === tomadorCNPJ);

    if (ultimaNota && confirm("Foi identificada uma nota anterior para este tomador. Deseja carregar os valores e descrição?")) {
        document.getElementById('i-vlr-total').value = (ultimaNota.valor_total || 0).toFixed(2).replace('.',',');
        document.getElementById('i-discr').value = ultimaNota.discriminacao || '';
        document.getElementById('i-iss').value = ultimaNota.iss_retido || 'Não';
        let cnaeApenas = ultimaNota.cnae || ''; let itemApenas = '';
        const matchCnae = cnaeApenas.match(/(.*?)\s*\(Item LC:\s*(.*?)\)/);
        if(matchCnae) { document.getElementById('i-cnae').value = matchCnae[1].trim(); document.getElementById('i-item').value = matchCnae[2].trim(); }
        else { document.getElementById('i-cnae').value = cnaeApenas; }

        if (document.getElementById('i-cod-trib-nac')) document.getElementById('i-cod-trib-nac').value = ultimaNota.codigo_tributario_nacional || '';
        if (document.getElementById('i-ctiss')) document.getElementById('i-ctiss').value = ultimaNota.ctiss || '';
        if (document.getElementById('i-nbs')) document.getElementById('i-nbs').value = ultimaNota.nbs || '';
        if (document.getElementById('i-cclasstrib')) document.getElementById('i-cclasstrib').value = ultimaNota.cclasstrib || '';
        if (document.getElementById('i-cindop')) document.getElementById('i-cindop').value = ultimaNota.cindop || '';

        document.getElementById('i-inss').value = (ultimaNota.inss||0).toFixed(2).replace('.',',');
        document.getElementById('i-irrf').value = (ultimaNota.irrf||0).toFixed(2).replace('.',',');
        document.getElementById('i-csll').value = (ultimaNota.csll||0).toFixed(2).replace('.',',');
        document.getElementById('i-cofins').value = (ultimaNota.cofins||0).toFixed(2).replace('.',',');
        document.getElementById('i-pis').value = (ultimaNota.pis||0).toFixed(2).replace('.',',');
        document.getElementById('i-outras').value = (ultimaNota.outras_retencoes||0).toFixed(2).replace('.',',');
        calcularLiquido(); verificarRegrasEspeciais(); flash("Dados preenchidos baseados na nota #"+ultimaNota.id, "sucesso");
    }
}

function salvarSolicitacao() {
    const f = document.getElementById('form-solicitacao'); const btn = document.getElementById('btn-salvar-n');
    const num = (n) => parseMoeda(f.elements[n].value);
    const valor = num('valor_total'); const liqCalc = num('valor_liquido'); const liqInf = num('valor_liquido_informado');

    if (liqInf > 0 && Math.abs(liqCalc - liqInf) > 0.02) {
        if (!confirm(`⚠️ ALERTA DE DIVERGÊNCIA!\n\nValor líquido calculado (R$ ${liqCalc.toFixed(2).replace('.',',')}) diferente do Informado (R$ ${liqInf.toFixed(2).replace('.',',')}). Salvar mesmo assim?`)) { return; }
    }
    btn.textContent = "Gravando..."; btn.disabled = true;

    const cnpjTomadorFinal = document.getElementById('t-cnpj').value.trim();

    // CORREÇÃO: Garante que o documento tenha 11 (CPF) ou 14 (CNPJ) números.
    const numDocs = cnpjTomadorFinal.replace(/\D/g, '').length;
    if (numDocs !== 11 && numDocs !== 14) {
        flash('O CPF/CNPJ do tomador é inválido (deve ter 11 ou 14 dígitos numéricos).', 'erro');
        btn.textContent = f.elements['id_edicao'].value ? 'Atualizar Solicitação' : 'Salvar Solicitação (Avaliação)';
        btn.disabled = false;
        return;
    }

    const prestadorId = parseInt(f.elements['prestador_id'].value, 10);

    if (isNaN(prestadorId)) { flash('Selecione um Prestador da lista.', 'erro'); btn.textContent = "Salvar Solicitação"; btn.disabled = false; return; }
    const prestador = db.prestadores.find(x => x.id === prestadorId);
    if (!prestador || !f.discriminacao.value.trim() || valor <= 0 || !cnpjTomadorFinal) {
        flash('Preencha os campos obrigatórios (*)', 'erro'); btn.textContent = "Salvar Solicitação"; btn.disabled = false; return;
    }

    const cnaeBruto = f.cnae.value.trim().split(' - ')[0]; const itemBruto = f.item_lista.value.trim().split(' - ')[0];
    const cnaeFinal = itemBruto ? `${cnaeBruto} (Item LC: ${itemBruto})` : cnaeBruto;

    const isMista = !document.getElementById('painel-mista').classList.contains('hidden');
    let textoDiscriminacao = f.discriminacao.value.trim();
    if (isMista) { textoDiscriminacao += `\n\n(Serviço Tributação Mista - Valor Base ISS: R$ ${num('valor_servico').toFixed(2).replace('.',',')} / Valor Peças: R$ ${num('valor_pecas').toFixed(2).replace('.',',')})`; }

    const issRetidoFinal = document.getElementById('i-iss').value;
  const pisCofinsRetidoFinal = document.getElementById('i-pis-cofins-retido').value;

    const solParaPlanilha = {
        id: document.getElementById('id_edicao').value || null,
        prestador_name: prestador.razao_social, prestador_cnpj: prestador.cnpj, prestador_senha: prestador.senha_prefeitura || "",
        tomador_cnpj: cnpjTomadorFinal, cnae: cnaeFinal, aliquota: num('aliquota'), discriminacao: textoDiscriminacao,
        valor_total: valor, iss_retido: issRetidoFinal, pis_cofins_retido: pisCofinsRetidoFinal, data_competencia: f.data_competencia.value || null,
        inss: num('inss'), irrf: num('irrf'), csll: num('csll'), cofins: num('cofins'), pis: num('pis'), outras_retencoes: num('outras_retencoes'),
        valor_liquido: liqCalc,
        criada_por_nome: db.sessao.nome, criada_por_email: db.sessao.email, socio_solicitante: f.socio_solicitante.value.trim(),
        regime_tomador: f.regime_tomador.value,
        codigo_tributario_nacional: document.getElementById('i-cod-trib-nac').value.trim(),
        ctiss: document.getElementById('i-ctiss').value.trim(),
        nbs: document.getElementById('i-nbs').value.trim(),
        cclasstrib: document.getElementById('i-cclasstrib').value.trim(),
        cindop: document.getElementById('i-cindop').value.trim()
    };

    google.script.run.withFailureHandler(function(erro) { flash('Erro Google: ' + erro, 'erro'); btn.textContent = "Salvar Solicitação"; btn.disabled = false; })
        .withSuccessHandler(function(resposta) {
            if (resposta.sucesso) { flash(solParaPlanilha.id ? 'Solicitação Atualizada!' : 'Solicitação Criada!'); carregarDadosIniciais(); }
            else { flash('Erro Planilha: ' + resposta.erro, 'erro'); btn.textContent = "Salvar Solicitação"; btn.disabled = false;}
        }).salvarNotaNaPlanilha(solParaPlanilha);
}
</script>
